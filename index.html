dth:auto!important;margin-top:.2rem;accent-color:var(--primary)}.hint a{color:var(--primary);text-decoration:none}.hint a:hover,.hint a:focus-visible{color:var(--primary-hover);text-decoration:underline;outline:none}.editor-shell{border:1px solid #cbd5e1;border-radius:14px;overflow:hidden}.editor-toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:.55rem;border-top:1px solid #e2e8f0;background:#f8fafc}.editor-tool{min-width:34px;min-height:32px;padding:.35rem .55rem;border:1px solid #d7dee8;border-radius:8px;background:#fff;color:#334155;cursor:pointer;font-size:.86rem}.editor-tool.bold{font-weight:700}.editor-tool.italic{font-style:italic}.editor-tool.underline{text-decoration:underline}.editor{min-height:320px;max-height:52vh;overflow-y:auto;padding:1rem 1.05rem;font-size:1rem;line-height:1.8;outline:none}.editor:empty:before{content:"输入正文……";color:#94a3b8;pointer-events:none}.editor p,.editor div,.editor ul,.editor ol,.editor blockquote{margin:.55rem 0}.editor ul,.editor ol{padding-left:1.6rem}.modal-actions,.config-actions{flex:0 0 auto;display:flex;justify-content:flex-end;gap:10px;padding:.95rem 1.6rem max(.95rem,env(safe-area-inset-bottom));border-top:1px solid #e2e8f0;background:#fff;box-shadow:0 -8px 18px rgba(15,23,42,.04)}.modal-btn,.btn-config{padding:.62rem 1.45rem;border:0;border-radius:999px;font-weight:700;cursor:pointer}.modal-actions .delete-modal{margin-right:auto}.delete-modal{background:#fff1f2;color:#991b1b}.delete-modal:hover{background:#ffe4e6}.secondary{background:#f1f5f9;color:#334155}.primary{background:var(--primary);color:#fff}.primary:hover,.primary:focus-visible{background:var(--primary-hover);outline:none}.token-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px}.token-btn{border:1px solid #d1d9e6;border-radius:12px;background:#f8fafc;color:#334155;padding:.66rem .85rem;font-size:.82rem;font-weight:700;white-space:nowrap;cursor:pointer}.token-btn.danger{color:#991b1b;background:#fff7f7;border-color:#fecaca}.token-b <script>
(()=>{
'use strict';

// ---------- 页面实例与静态站架构 ----------
function pageIdentity(){
    let p=(location.pathname||'/').replace(/\\/g,'/').replace(/\/+/g,'/').replace(/\/(?:index\.html?)$/i,'/');
    if(p.length>1&&p.endsWith('/'))p=p.slice(0,-1);
    return `${location.origin}${p}`;
}
function hashIdentity(value){
    let hash=0x811c9dc5;
    for(let i=0;i<value.length;i++){
        hash^=value.charCodeAt(i);
        hash=Math.imul(hash,0x01000193);
    }
    return (hash>>>0).toString(16).padStart(8,'0');
}
const NS=`blog_private:${hashIdentity(pageIdentity())}`;
const CONFIG_KEY=`${NS}:config`;
const TOKEN_KEY=`${NS}:token`;
const WORK_CACHE_KEY=`${NS}:working`;
const PUBLIC_CACHE_KEY=`${NS}:public_cache`;
const META_KEY=`${NS}:meta`;

const APP_DB_NAME='blog_app_v2';
const APP_DB_VERSION=1;
const APP_STORE='kv';
const WORK_OPFS_FILE=`blog_${hashIdentity(pageIdentity())}_working_v2.json`;

const DRAFT_DB_NAME='blog_entry_draft_v1';
const DRAFT_DB_VERSION=1;
const DRAFT_STORE='records';
const ENTRY_DRAFT_KEY=`${NS}:draft:entry`;
const DRAFT_OPFS_FILE=`blog_${hashIdentity(pageIdentity())}_entry_draft_v1.json`;
const DRAFT_INTERVAL=5000;
const DRAFT_LOCAL_DEBOUNCE=500;

const MAX_SYNC=750*1024;
const AUTO_DELAY=700;
const API_VERSION='2026-03-10';
const PUBLIC_DATA_FILE=String(document.querySelector('meta[name="blog-data-file"]')?.content||'blog_data.json').trim()||'blog_data.json';

const $=id=>document.getElementById(id);
const addLink=$('addLink'),syncBtn=$('syncBtn'),configBtn=$('configBtn'),lastSyncTime=$('lastSyncTime'),
statusDot=$('statusDot'),statusText=$('statusText'),entryList=$('entryList'),
tocEdgeSensor=$('tocEdgeSensor'),tocControl=$('tocControl'),tocButton=$('tocButton'),tocPanel=$('tocPanel'),tocList=$('tocList'),
backToTopBtn=$('backToTopBtn'),entryModal=$('entryModal'),entryModalTitle=$('entryModalTitle'),
titleInput=$('titleInput'),dateInput=$('dateInput'),bodyEditor=$('bodyEditor'),entryDeleteBtn=$('entryDeleteBtn'),
entryCancelBtn=$('entryCancelBtn'),entrySaveBtn=$('entrySaveBtn'),indentBtn=$('indentBtn'),
inlineMathBtn=$('inlineMathBtn'),displayMathBtn=$('displayMathBtn'),
configModal=$('configModal'),configForm=$('configForm'),cfgToken=$('cfgToken'),cfgOwner=$('cfgOwner'),
cfgRepo=$('cfgRepo'),cfgFile=$('cfgFile'),rememberToken=$('rememberToken'),
configCancelBtn=$('configCancelBtn'),configSaveBtn=$('configSaveBtn'),toast=$('toast');

let entries=[];
let editingId=null;
let config={owner:'',repo:'',file:'blog_data.json',token:''};
let meta={target:'',fingerprint:null,sha:null,lastSyncAt:null};
let unlocked=false,publicLoaded=false,isSyncing=false,autoTimer=null,previousFocus=null,toastTimer=null;
let entryInitialState='',entryBackdropPressed=false;
let entryDraftTimer=null,entryDraftInputTimer=null,entryDraftLastSnapshot='',entryDraftWriteChain=Promise.resolve();
let draftRestoredThisSession=false;

const appCache=new Map();
let appDbPromise=null,appWriteChain=Promise.resolve();
let workingCopyOpfsRecord=null,workingCopyOpfsWriteChain=Promise.resolve();

// ---------- 通用文本 / 富文本 ----------
function esc(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML}
function attr(v){return esc(v).replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
const TAGS=new Set(['P','DIV','BR','B','STRONG','I','EM','U','UL','OL','LI','BLOCKQUOTE','SPAN','HR']);
function linksToMarkdown(html){
    const t=document.createElement('template');
    t.innerHTML=String(html||'');
    t.content.querySelectorAll('a[href]').forEach(a=>{
        const href=(a.getAttribute('href')||'').trim(),label=(a.textContent||'').trim();
        a.replaceWith(document.createTextNode(/^https?:\/\//i.test(href)?`[${label||href}](${href})`:(a.textContent||'')));
    });
    return t.innerHTML;
}
function cleanForStorage(html){
    const t=document.createElement('template');
    t.innerHTML=linksToMarkdown(html);
    const walk=n=>{
        [...n.childNodes].forEach(c=>{
            if(c.nodeType===Node.ELEMENT_NODE){
                if(!TAGS.has(c.tagName)){c.replaceWith(...c.childNodes);return;}
                [...c.attributes].forEach(a=>{if(a.name.toLowerCase()!=='style')c.removeAttribute(a.name)});
                if(c.hasAttribute('style')){
                    const safe=[];
                    (c.getAttribute('style')||'').split(';').forEach(x=>{
                        const [pr,...rest]=x.split(':');
                        if(!pr||!rest.length)return;
                        const p=pr.trim().toLowerCase(),v=rest.join(':').trim();
                        if(p==='text-align'&&/^(left|center|right|justify)$/i.test(v))safe.push(`text-align:${v.toLowerCase()}`);
                        else if(p==='text-indent'&&/^(2em|0(?:px|em|rem|%)?)$/i.test(v))safe.push(`text-indent:${v}`);
                        else if(p==='font-weight'&&/^(bold|700)$/i.test(v))safe.push('font-weight:bold');
                        else if(p==='font-style'&&/^italic$/i.test(v))safe.push('font-style:italic');
                        else if(p==='text-decoration'&&/^underline$/i.test(v))safe.push('text-decoration:underline');
                    });
                    safe.length?c.setAttribute('style',safe.join(';')):c.removeAttribute('style');
                }
                walk(c);
            }else if(c.nodeType!==Node.TEXT_NODE)c.remove();
        });
    };
    walk(t.content);
    return t.innerHTML.trim();
}
function textOf(h){
    const d=document.createElement('div');
    d.innerHTML=cleanForStorage(h);
    return(d.textContent||'').replace(/\u00a0/g,' ').trim();
}
function renderBody(h){
    const t=document.createElement('template');
    t.innerHTML=cleanForStorage(h);
    const re=/\[([^\]\r\n]+)\]\((https?:\/\/[^\s<>()]+)\)/gi;
    const walk=n=>{
        [...n.childNodes].forEach(c=>{
            if(c.nodeType===Node.TEXT_NODE){
                const s=c.nodeValue||'';
                re.lastIndex=0;
                if(!re.test(s))return;
                re.lastIndex=0;
                const f=document.createDocumentFragment();
                let last=0,m;
                while((m=re.exec(s))){
                    if(m.index>last)f.appendChild(document.createTextNode(s.slice(last,m.index)));
                    const a=document.createElement('a');
                    a.href=m[2];a.target='_blank';a.rel='noopener noreferrer';a.textContent=m[1];
                    f.appendChild(a);last=re.lastIndex;
                }
                if(last<s.length)f.appendChild(document.createTextNode(s.slice(last)));
                c.replaceWith(f);
            }else if(c.nodeType===Node.ELEMENT_NODE)walk(c);
        });
    };
    walk(t.content);
    return t.innerHTML;
}
function clipboardHtmlToMarkdownText(html,fallback=''){
    const t=document.createElement('template');
    t.innerHTML=String(html||'');
    const blockTags=new Set(['P','DIV','LI','BLOCKQUOTE','UL','OL','H1','H2','H3','H4','H5','H6','PRE']);
    const read=n=>{
        if(n.nodeType===Node.TEXT_NODE)return n.nodeValue||'';
        if(n.nodeType!==Node.ELEMENT_NODE&&n.nodeType!==Node.DOCUMENT_FRAGMENT_NODE)return'';
        if(n.nodeType===Node.ELEMENT_NODE){
            const tag=n.tagName.toUpperCase();
            if(tag==='BR')return'\n';
            if(tag==='A'){
                const href=(n.getAttribute('href')||'').trim(),label=(n.textContent||'').replace(/\u00a0/g,' ').trim();
                return /^https?:\/\/[^\s<>()]+$/i.test(href)?`[${label||href}](${href})`:label;
            }
            let inner=[...n.childNodes].map(read).join('');
            if(blockTags.has(tag)&&inner&&!inner.endsWith('\n'))inner+='\n';
            return inner;
        }
        return[...n.childNodes].map(read).join('');
    };
    const result=read(t.content).replace(/\r\n?/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
    return result||String(fallback||'');
}

// ---------- 数学公式：与最终版 Cards / Demo / Note / Repo 一致 ----------
function looksLikeLatexPlainText(text){
    const s=String(text||'');
    if(!s)return false;
    if(/\$\$[\s\S]+?\$\$/.test(s))return true;
    if(/\$(?!\$)(?:\\.|[^$\r\n])+?\$/.test(s))return true;
    if(/\\\([\s\S]+?\\\)/.test(s))return true;
    if(/\\\[[\s\S]+?\\\]/.test(s))return true;
    return /\\(?:frac|dfrac|tfrac|sqrt|sum|prod|int|iint|iiint|oint|lim|log|ln|sin|cos|tan|arcsin|arccos|arctan|alpha|beta|gamma|delta|epsilon|varepsilon|theta|vartheta|lambda|mu|nu|xi|pi|rho|sigma|tau|phi|varphi|chi|psi|omega|Gamma|Delta|Theta|Lambda|Xi|Pi|Sigma|Phi|Psi|Omega|mathrm|mathbf|mathit|mathbb|mathcal|text|operatorname|begin|end|left|right|cdot|times|div|pm|mp|leq|geq|neq|approx|equiv|infty|partial|nabla|overline|underline|hat|widehat|bar|vec|dot|ddot|boxed)\b/.test(s);
}
function clipboardTextForEditor(plain,html){
    const rawPlain=String(plain??'');
    if(looksLikeLatexPlainText(rawPlain))return rawPlain.replace(/\r\n?/g,'\n');
    return html?clipboardHtmlToMarkdownText(html,rawPlain):rawPlain;
}
const MATHJAX_SOURCES=[
    'https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js',
    'https://unpkg.com/mathjax@4/tex-chtml.js',
    'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.min.js'
];
let mathJaxLoadPromise=null,mathRenderVersion=0;
function ensureMathJax(){
    if(window.MathJax&&typeof window.MathJax.typesetPromise==='function')return Promise.resolve(window.MathJax);
    if(mathJaxLoadPromise)return mathJaxLoadPromise;
    const existing=(window.MathJax&&typeof window.MathJax==='object')?window.MathJax:{};
    window.MathJax={
        ...existing,
        tex:{
            ...(existing.tex||{}),
            inlineMath:[['$','$'],['\\(','\\)']],
            displayMath:[['$$','$$'],['\\[','\\]']],
            processEscapes:true
        },
        startup:{...(existing.startup||{}),typeset:false}
    };
    mathJaxLoadPromise=new Promise((resolve,reject)=>{
        let index=0;
        const tryNext=()=>{
            if(index>=MATHJAX_SOURCES.length){reject(new Error('数学公式渲染器加载失败'));return;}
            const script=document.createElement('script');
            script.src=MATHJAX_SOURCES[index++];
            script.defer=true;script.crossOrigin='anonymous';
            script.onload=()=>{
                if(window.MathJax&&typeof window.MathJax.typesetPromise==='function')resolve(window.MathJax);
                else{script.remove();tryNext();}
            };
            script.onerror=()=>{script.remove();tryNext();};
            document.head.appendChild(script);
        };
        tryNext();
    });
    return mathJaxLoadPromise;
}
function clearTypesetMath(container){
    if(window.MathJax&&typeof window.MathJax.typesetClear==='function'){
        try{window.MathJax.typesetClear([container]);}catch(error){console.warn('清理公式渲染状态失败',error);}
    }
}
function queueMathTypeset(container,version){
    ensureMathJax().then(async mathJax=>{
        if(version!==mathRenderVersion||!container.isConnected)return;
        try{await mathJax.typesetPromise([container]);}
        catch(error){console.error('数学公式渲染失败',error);}
    }).catch(error=>console.error(error));
}

// ---------- Blog 数据模型：保持原内容设定 ----------
function id(){return crypto?.randomUUID?crypto.randomUUID():`entry_${Date.now()}_${Math.random().toString(36).slice(2,9)}`}
function norm(x){
    if(!x||typeof x!=='object')return null;
    const title=typeof x.title==='string'?x.title.trim():'';
    const date=typeof x.date==='string'?x.date.trim():'';
    const body=cleanForStorage(typeof x.body==='string'?x.body:'');
    if(!title||!date||!textOf(body))return null;
    return{
        id:typeof x.id==='string'&&x.id?x.id:id(),
        title,date,body,
        createdAt:Number.isFinite(x.createdAt)?x.createdAt:Date.now(),
        updatedAt:Number.isFinite(x.updatedAt)?x.updatedAt:Date.now()
    };
}
function normList(v){return Array.isArray(v)?v.map(norm).filter(Boolean):[]}
function sortEntries(list=entries){
    list.sort((a,b)=>b.date.localeCompare(a.date,'zh-CN',{numeric:true})||(b.createdAt||0)-(a.createdAt||0)||a.title.localeCompare(b.title,'zh-CN'));
    return list;
}
function fingerprint(v=entries){
    return JSON.stringify(normList(v).map(x=>({
        id:x.id,title:x.title,date:x.date,body:x.body,createdAt:x.createdAt,updatedAt:x.updatedAt
    })).sort((a,b)=>a.date.localeCompare(b.date)||a.title.localeCompare(b.title,'zh-CN')||a.id.localeCompare(b.id)));
}
function serialize(v){return JSON.stringify(normList(v),null,2)}
function assertSize(v){
    const n=new TextEncoder().encode(serialize(v)).length;
    if(n>MAX_SYNC)throw new Error(`博客数据约 ${Math.ceil(n/1024)} KB，超过 750 KB 的安全同步上限`);
}
function today(){
    const n=new Date();
    return new Date(n.getTime()-n.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function target(){
    return config.owner&&config.repo&&config.file?`${config.owner}/${config.repo}/${config.file}`:'';
}
function validConfig(){return Boolean(config.token&&config.owner&&config.repo&&config.file)}
function pathEncode(p){return String(p).split('/').filter(Boolean).map(encodeURIComponent).join('/')}

function autoIndentBeforeFirstDivider(html){
    const t=document.createElement('template');
    t.innerHTML=cleanForStorage(html);
    const firstHr=t.content.querySelector('hr'),blockTags=new Set(['P','DIV','BLOCKQUOTE','LI']);
    const isBefore=n=>!firstHr||!!(n.compareDocumentPosition(firstHr)&Node.DOCUMENT_POSITION_FOLLOWING);
    for(const el of t.content.querySelectorAll('p,div,blockquote,li')){
        if(!isBefore(el))continue;
        if(firstHr&&el.contains(firstHr))continue;
        const nested=[...el.children].some(c=>blockTags.has(c.tagName));
        const hasText=(el.textContent||'').replace(/\u00a0/g,' ').trim();
        if(!nested&&hasText&&!String(el.style.textIndent||'').trim())el.style.textIndent='2em';
    }
    const direct=[...t.content.childNodes];
    let run=[];
    const flush=()=>{
        if(!run.length)return;
        const meaningful=run.some(n=>n.nodeType===Node.TEXT_NODE&&(n.nodeValue||'').replace(/\u00a0/g,' ').trim());
        if(meaningful){
            const d=document.createElement('div');d.style.textIndent='2em';run[0].before(d);run.forEach(n=>d.appendChild(n));
        }
        run=[];
    };
    for(const n of direct){
        if(!isBefore(n)){flush();break;}
        if(n.nodeType===Node.TEXT_NODE||n.nodeType===Node.ELEMENT_NODE&&n.tagName==='BR')run.push(n);
        else flush();
    }
    flush();
    return cleanForStorage(t.innerHTML);
}

// ---------- IndexedDB + OPFS 正式浏览器状态 ----------
function openAppDb(){
    if(appDbPromise)return appDbPromise;
    appDbPromise=new Promise((resolve,reject)=>{
        if(!('indexedDB' in window)){reject(new Error('IndexedDB unavailable'));return;}
        const request=indexedDB.open(APP_DB_NAME,APP_DB_VERSION);
        request.onupgradeneeded=()=>{
            const db=request.result;
            if(!db.objectStoreNames.contains(APP_STORE))db.createObjectStore(APP_STORE,{keyPath:'key'});
        };
        request.onsuccess=()=>resolve(request.result);
        request.onerror=()=>reject(request.error||new Error('IndexedDB open failed'));
    });
    return appDbPromise;
}
async function enqueueAppPut(key,value){
    appWriteChain=appWriteChain.catch(()=>{}).then(async()=>{
        const db=await openAppDb();
        await new Promise((resolve,reject)=>{
            const tx=db.transaction(APP_STORE,'readwrite');
            tx.objectStore(APP_STORE).put({key:String(key),value:String(value)});
            tx.oncomplete=()=>resolve();
            tx.onerror=()=>reject(tx.error||new Error('IndexedDB write failed'));
            tx.onabort=()=>reject(tx.error||new Error('IndexedDB write aborted'));
        });
    });
    return appWriteChain;
}
async function enqueueAppDelete(key){
    appWriteChain=appWriteChain.catch(()=>{}).then(async()=>{
        const db=await openAppDb();
        await new Promise((resolve,reject)=>{
            const tx=db.transaction(APP_STORE,'readwrite');
            tx.objectStore(APP_STORE).delete(String(key));
            tx.oncomplete=()=>resolve();
            tx.onerror=()=>reject(tx.error||new Error('IndexedDB delete failed'));
            tx.onabort=()=>reject(tx.error||new Error('IndexedDB delete aborted'));
        });
    });
    return appWriteChain;
}
function appGet(key){return appCache.has(String(key))?appCache.get(String(key)):null}
async function appSet(key,value){
    const k=String(key),v=String(value);
    await enqueueAppPut(k,v);
    appCache.set(k,v);
}
function appDelete(key){
    const k=String(key);
    appCache.delete(k);
    return enqueueAppDelete(k);
}
async function readWorkingCopyOpfs(){
    if(!navigator.storage?.getDirectory)return null;
    try{
        const root=await navigator.storage.getDirectory();
        const handle=await root.getFileHandle(WORK_OPFS_FILE);
        const file=await handle.getFile();
        const record=JSON.parse(await file.text());
        return record&&typeof record==='object'&&typeof record.cacheJson==='string'?record:null;
    }catch(error){return null;}
}
function queueWorkingCopyOpfsWrite(snapshot=entries){
    const normalized=sortEntries(normList(snapshot));
    const record={savedAt:Date.now(),fingerprint:fingerprint(normalized),cacheJson:JSON.stringify(normalized)};
    workingCopyOpfsRecord=record;
    workingCopyOpfsWriteChain=workingCopyOpfsWriteChain.catch(()=>{}).then(async()=>{
        if(!navigator.storage?.getDirectory)return false;
        const root=await navigator.storage.getDirectory();
        const handle=await root.getFileHandle(WORK_OPFS_FILE,{create:true});
        const writable=await handle.createWritable();
        await writable.write(JSON.stringify(record));
        await writable.close();
        return true;
    }).catch(error=>{console.warn('OPFS 工作副本写入失败',error);return false;});
    return workingCopyOpfsWriteChain;
}
async function initAppStorage(){
    const db=await openAppDb();
    await new Promise((resolve,reject)=>{
        const tx=db.transaction(APP_STORE,'readonly');
        const request=tx.objectStore(APP_STORE).getAll();
        request.onsuccess=()=>{
            appCache.clear();
            for(const row of request.result||[])appCache.set(String(row.key),String(row.value??''));
            resolve();
        };
        request.onerror=()=>reject(request.error||new Error('IndexedDB read failed'));
    });
    try{if(navigator.storage?.persist)await navigator.storage.persist();}catch(error){}
    workingCopyOpfsRecord=await readWorkingCopyOpfs();
    if(appGet(WORK_CACHE_KEY)===null&&workingCopyOpfsRecord?.cacheJson){
        appCache.set(WORK_CACHE_KEY,String(workingCopyOpfsRecord.cacheJson));
        await enqueueAppPut(WORK_CACHE_KEY,String(workingCopyOpfsRecord.cacheJson));
    }
}
async function persistWorkingCopyNow(snapshot=entries){
    const normalized=sortEntries(normList(snapshot));
    const json=JSON.stringify(normalized);
    appCache.set(WORK_CACHE_KEY,json);
    const idbPromise=enqueueAppPut(WORK_CACHE_KEY,json);
    const opfsPromise=queueWorkingCopyOpfsWrite(normalized);
    const results=await Promise.allSettled([idbPromise,opfsPromise]);
    if(results[0].status==='rejected')throw results[0].reason||new Error('IndexedDB 工作副本写入失败');
    return normalized;
}
function saveWorkingCache(){
    const normalized=sortEntries(normList(entries));
    const json=JSON.stringify(normalized);
    appCache.set(WORK_CACHE_KEY,json);
    enqueueAppPut(WORK_CACHE_KEY,json).catch(error=>console.error('IndexedDB 工作副本写入失败',error));
    queueWorkingCopyOpfsWrite(normalized);
}
function loadWorkingCache(){
    try{return sortEntries(normList(JSON.parse(appGet(WORK_CACHE_KEY)||'[]')));}catch(error){return [];}
}
function savePublicCache(){
    const normalized=sortEntries(normList(entries));
    const json=JSON.stringify(normalized);
    appCache.set(PUBLIC_CACHE_KEY,json);
    enqueueAppPut(PUBLIC_CACHE_KEY,json).catch(error=>console.error('公开缓存写入失败',error));
}
function loadPublicCache(){
    try{return sortEntries(normList(JSON.parse(appGet(PUBLIC_CACHE_KEY)||'[]')));}catch(error){return [];}
}

// ---------- 配置 / Token / 同步元数据 ----------
function loadConfig(){
    let saved={};
    try{saved=JSON.parse(appGet(CONFIG_KEY)||'{}')||{};}catch(error){}
    config.owner=String(saved.owner||'').trim();
    config.repo=String(saved.repo||'').trim();
    config.file=String(saved.file||'').trim()||'blog_data.json';
    config.token=String(appGet(TOKEN_KEY)||'').trim();

    if(cfgOwner)cfgOwner.value=config.owner;
    if(cfgRepo)cfgRepo.value=config.repo;
    if(cfgFile)cfgFile.value=config.file;
    if(cfgToken)cfgToken.value=config.token;
    if(rememberToken)rememberToken.checked=Boolean(config.token);
}
async function persistConfig(){
    const jobs=[appSet(CONFIG_KEY,JSON.stringify({owner:config.owner,repo:config.repo,file:config.file}))];
    if(rememberToken.checked)jobs.push(appSet(TOKEN_KEY,config.token));
    else jobs.push(appDelete(TOKEN_KEY));
    const results=await Promise.allSettled(jobs);
    const failed=results.find(r=>r.status==='rejected');
    if(failed)throw failed.reason||new Error('配置持久化失败');
}
function loadMeta(){
    try{
        const x=JSON.parse(appGet(META_KEY)||'{}')||{};
        meta={
            target:String(x.target||'').trim(),
            fingerprint:typeof x.fingerprint==='string'?x.fingerprint:null,
            sha:typeof x.sha==='string'&&x.sha?x.sha:null,
            lastSyncAt:typeof x.lastSyncAt==='string'&&x.lastSyncAt?x.lastSyncAt:null
        };
    }catch(error){meta={target:'',fingerprint:null,sha:null,lastSyncAt:null};}
}
function saveMeta(){
    return appSet(META_KEY,JSON.stringify(meta)).catch(error=>console.error('同步元数据写入失败',error));
}
function record(snapshot,sha){
    meta={target:target(),fingerprint:fingerprint(snapshot),sha:sha||null,lastSyncAt:new Date().toISOString()};
    saveMeta();
    updateSyncTime();
}
function updateSyncTime(){
    if(!meta.lastSyncAt||meta.target!==target()){lastSyncTime.textContent=unlocked?'未同步':'公开浏览 · 编辑需 Token';return;}
    const d=new Date(meta.lastSyncAt);
    lastSyncTime.textContent=Number.isNaN(d.getTime())?'已同步':`已同步 ${d.toLocaleString()}`;
}
function saveCache(){unlocked?saveWorkingCache():savePublicCache()}
function setUnlocked(on){
    unlocked=Boolean(on);
    addLink.hidden=!unlocked;
    syncBtn.hidden=!unlocked;
    syncBtn.disabled=!unlocked;
    configBtn.textContent=unlocked?'配置':'编辑登录';

    }else{

    }
}

// ---------- IndexedDB + OPFS 草稿 ----------
function draftRecordValid(record){
    return !!record&&typeof record==='object'&&['draft','tombstone'].includes(record.kind)&&Number(record.savedAt)>0;
}
function openDraftDb(){
    return new Promise((resolve,reject)=>{
        if(!('indexedDB' in window)){reject(new Error('IndexedDB unavailable'));return;}
        const request=indexedDB.open(DRAFT_DB_NAME,DRAFT_DB_VERSION);
        request.onupgradeneeded=()=>{
            const db=request.result;
            if(!db.objectStoreNames.contains(DRAFT_STORE))db.createObjectStore(DRAFT_STORE,{keyPath:'key'});
        };
        request.onsuccess=()=>resolve(request.result);
        request.onerror=()=>reject(request.error||new Error('IndexedDB open failed'));
    });
}
async function draftDbRead(key){
    const db=await openDraftDb();
    try{
        return await new Promise((resolve,reject)=>{
            const tx=db.transaction(DRAFT_STORE,'readonly');
            const req=tx.objectStore(DRAFT_STORE).get(key);
            req.onsuccess=()=>resolve(req.result?.record||null);
            req.onerror=()=>reject(req.error||new Error('IndexedDB read failed'));
        });
    }finally{db.close();}
}
async function draftDbWrite(key,record){
    const db=await openDraftDb();
    try{
        await new Promise((resolve,reject)=>{
            const tx=db.transaction(DRAFT_STORE,'readwrite');
            tx.objectStore(DRAFT_STORE).put({key,record});
            tx.oncomplete=()=>resolve();
            tx.onerror=()=>reject(tx.error||new Error('IndexedDB write failed'));
            tx.onabort=()=>reject(tx.error||new Error('IndexedDB write aborted'));
        });
    }finally{db.close();}
}
async function draftOpfsRead(){
    if(!navigator.storage?.getDirectory)return null;
    try{
        const root=await navigator.storage.getDirectory();
        const handle=await root.getFileHandle(DRAFT_OPFS_FILE);
        const file=await handle.getFile();
        const record=JSON.parse(await file.text());
        return draftRecordValid(record)?record:null;
    }catch(error){return null;}
}
async function draftOpfsWrite(record){
    if(!navigator.storage?.getDirectory)return false;
    try{
        const root=await navigator.storage.getDirectory();
        const handle=await root.getFileHandle(DRAFT_OPFS_FILE,{create:true});
        const writable=await handle.createWritable();
        await writable.write(JSON.stringify(record));
        await writable.close();
        return true;
    }catch(error){console.warn('OPFS 草稿写入失败',error);return false;}
}
function enqueueDraftWrite(record){
    entryDraftWriteChain=entryDraftWriteChain.catch(()=>{}).then(async()=>{
        const results=await Promise.allSettled([draftDbWrite(ENTRY_DRAFT_KEY,record),draftOpfsWrite(record)]);
        const dbOk=results[0].status==='fulfilled';
        const opfsOk=results[1].status==='fulfilled'&&results[1].value!==false;
        if(!dbOk&&!opfsOk)throw new Error('草稿本地持久化失败');
    });
    return entryDraftWriteChain;
}
async function readBestDraftRecord(){
    let a=null,b=null;
    try{a=await draftDbRead(ENTRY_DRAFT_KEY);}catch(error){console.warn('IndexedDB 草稿读取失败',error);}
    b=await draftOpfsRead();
    return [a,b].filter(draftRecordValid).sort((x,y)=>Number(y.savedAt)-Number(x.savedAt))[0]||null;
}
function entryStateSnapshot(){
    return JSON.stringify({
        mode:editingId?'edit':'add',
        editingId:String(editingId||''),
        title:String(titleInput.value??''),
        date:String(dateInput.value??''),
        body:cleanForStorage(bodyEditor.innerHTML)
    });
}
function entryHasChanges(){return entryStateSnapshot()!==entryInitialState}
function draftPayload(){
    return{
        version:1,mode:editingId?'edit':'add',editingId:String(editingId||''),
        title:String(titleInput.value??''),date:String(dateInput.value??''),
        body:cleanForStorage(bodyEditor.innerHTML),savedAt:Date.now()
    };
}
async function saveEntryDraftLocal(force=false){
    if(entryModal.classList.contains('hidden')||!unlocked)return false;
    if(!entryHasChanges()){
        if(entryDraftLastSnapshot)await clearEntryDraft();
        return false;
    }
    const snapshot=entryStateSnapshot();
    if(!force&&snapshot===entryDraftLastSnapshot)return true;
    const draft=draftPayload(),record={kind:'draft',savedAt:draft.savedAt,draft};
    entryDraftLastSnapshot=snapshot;
    try{await enqueueDraftWrite(record);return true;}
    catch(error){console.error('Blog 草稿自动保存失败',error);return false;}
}
function markEntryDraftChanged(){
    if(entryModal.classList.contains('hidden')||!unlocked)return;
    clearTimeout(entryDraftInputTimer);
    entryDraftInputTimer=setTimeout(()=>saveEntryDraftLocal(false),DRAFT_LOCAL_DEBOUNCE);
}
function startEntryDraftAutosave(){
    stopEntryDraftAutosave();
    entryDraftTimer=setInterval(()=>saveEntryDraftLocal(true),DRAFT_INTERVAL);
}
function stopEntryDraftAutosave(){
    if(entryDraftTimer!==null){clearInterval(entryDraftTimer);entryDraftTimer=null;}
    clearTimeout(entryDraftInputTimer);entryDraftInputTimer=null;
}
function clearEntryDraft(){
    entryDraftLastSnapshot='';
    return enqueueDraftWrite({kind:'tombstone',savedAt:Date.now()})
        .catch(error=>console.warn('Blog 草稿清除标记写入失败',error));
}
async function restoreEntryDraftIfAny(){
    if(!unlocked||draftRestoredThisSession)return false;
    draftRestoredThisSession=true;
    const record=await readBestDraftRecord();
    if(!record||record.kind!=='draft'||!record.draft)return false;
    const d=record.draft;
    if(d.mode==='edit'&&d.editingId&&entries.some(x=>x.id===d.editingId))openEntry(d.editingId);
    else openEntry();
    titleInput.value=String(d.title??'');
    dateInput.value=String(d.date??'')||today();
    bodyEditor.innerHTML=cleanForStorage(String(d.body??''));
    entryDraftLastSnapshot=entryStateSnapshot();
    showToast('已恢复上次未提交的草稿','info');
    return true;
}

function publicDataUrl(){return new URL(PUBLIC_DATA_FILE,location.href).href}
async function loadPublicView(){
    setStatus('syncing','加载公开内容…');
    lastSyncTime.textContent='公开浏览 · 编辑需 Token';
    try{
        const response=await fetch(publicDataUrl(),{method:'GET',cache:'no-store',headers:{Accept:'application/json'}});
        const raw=await response.text();
        if(!response.ok){
            const error=new Error(`公开数据加载失败：HTTP ${response.status}`);
            error.status=response.status;throw error;
        }
        if(new TextEncoder().encode(raw).length>MAX_SYNC)throw new Error('公开 Blog 数据超过 750 KB');
        const parsed=JSON.parse(raw);
        if(!Array.isArray(parsed))throw new Error('blog_data.json 根节点必须是数组');
        entries=sortEntries(normList(parsed));
        publicLoaded=true;
        render();
        setStatus('online','公开浏览');
        lastSyncTime.textContent='公开浏览 · 编辑需 Token';
        return true;
    }catch(error){
        console.error(error);
        if(error instanceof SyntaxError){
            showToast('blog_data.json JSON 格式错误','error');
        }else if(error.status===404){
            showToast('找不到 blog_data.json 文件','error');
        }else{
            showToast(`公开数据加载失败：${error.message||error}`,'error');
        }
        entries=loadPublicCache();
        publicLoaded=entries.length>0;
        render();
        if(publicLoaded){
            setStatus('offline','离线浏览');
            lastSyncTime.textContent='公开数据暂时不可用 · 当前显示本机缓存';
        }else{
            setStatus('offline','公开数据不可用');
            lastSyncTime.textContent='无法加载 blog_data.json · 编辑登录仍可使用';
        }
        return false;
    }
}

// ---------- GitHub API ----------
async function api(method,ep='',body=null){
    const suffix=ep?`/${ep}`:'';
    const response=await fetch(`https://api.github.com/repos/${encodeURIComponent(config.owner)}/${encodeURIComponent(config.repo)}${suffix}`,{
        method,
        headers:{
            Authorization:`Bearer ${config.token}`,
            Accept:'application/vnd.github+json',
            'X-GitHub-Api-Version':API_VERSION,
            ...(body!==null?{'Content-Type':'application/json'}:{})
        },
        ...(body!==null?{body:JSON.stringify(body)}:{})
    });
    const raw=await response.text();
    let data=null;
    if(raw)try{data=JSON.parse(raw)}catch(error){data={message:raw};}
    if(!response.ok){
        const error=new Error(data?.message||`HTTP ${response.status}`);
        error.status=response.status;error.payload=data;throw error;
    }
    return data;
}
function b64(t){
    const bytes=new TextEncoder().encode(t);let bin='';
    for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
    return btoa(bin);
}
function unb64(s){
    const bin=atob(String(s||'').replace(/\s/g,'')),bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
}
async function verifyRepository(){return api('GET')}
async function readRemote(){
    try{
        const d=await api('GET',`contents/${pathEncode(config.file)}`);
        if(!d||d.type!=='file'||typeof d.content!=='string'||!d.sha)throw new Error('云端数据文件格式异常');
        if(Number.isFinite(d.size)&&d.size>MAX_SYNC)throw new Error('云端 Blog 数据超过 750 KB');
        const parsed=JSON.parse(unb64(d.content));
        if(!Array.isArray(parsed))throw new Error('云端 JSON 根节点必须是数组');
        const list=sortEntries(normList(parsed));assertSize(list);
        return{exists:true,sha:d.sha,entries:list};
    }catch(error){
        if(error.status===404)return{exists:false,sha:null,entries:[]};
        throw error;
    }
}
async function writeRemote(v,sha){
    const n=sortEntries(normList(v));assertSize(n);
    const body={message:`更新 Blog 数据 - ${new Date().toLocaleString()}`,content:b64(serialize(n))};
    if(sha)body.sha=sha;
    const r=await api('PUT',`contents/${pathEncode(config.file)}`,body);
    return r?.content?.sha||null;
}
function fmt(error){
    if(!error)return'未知错误';
    if(error.status===401)return'Token 无效或已过期';
    if(error.status===403)return'Token 权限不足或仓库访问被拒绝';
    if(error.status===404)return'仓库、文件或路径不存在，或 Token 无权访问';
    if(error.status===409)return'云端文件已被其他设备修改';
    return error.message||String(error);
}

    if(!entries.length){tocList.innerHTML='<li class="toc-empty">暂无文章</li>';return;}
    tocList.innerHTML=entries.map(x=>`<li><a class="toc-link" href="#entry-${attr(x.id)}" data-id="${attr(x.id)}">${esc(x.title)}</a></li>`).join('');

function alignTocToFirstEntry(){

        tocControl.style.top=`${Math.max(8,first.getBoundingClientRect().top)}px`;
    });
}
function render(){
    sortEntries(entries);

    if(!entries.length){
        entryList.innerHTML='<div class="empty-state">暂无博客条目</div>';

    renderToc();saveCache();queueMathTypeset(entryList,currentMathVersion);alignTocToFirstEntry();
}

// ---------- 登录与同步：与 Cards 同样的公开/编辑分层 ----------
async function login(showResult=true){
    if(!validConfig()){
        setUnlocked(false);
        if(publicLoaded||entries.length)render();
        setStatus(publicLoaded?'online':'offline',publicLoaded?'公开浏览':'公开数据不可用');
        lastSyncTime.textContent=publicLoaded?'公开浏览 · 编辑需 Token':'公开数据未加载 · 编辑需 Token';
        if(showResult)showToast('请填写仓库和 Token 以启用编辑','error');
        return false;
    }
    setStatus('syncing','验证编辑权限…');syncBtn.disabled=true;
    try{
        await verifyRepository();
        const remote=await readRemote();
        const remoteFp=fingerprint(remote.entries);
        const cache=loadWorkingCache();
        const sameTarget=meta.target===target();
        const cacheFp=fingerprint(cache);
        const cacheUnsynced=sameTarget&&meta.fingerprint!==null&&cacheFp!==meta.fingerprint&&cacheFp!==remoteFp;

        if(cacheUnsynced){
            entries=cache;
            setUnlocked(true);
            render();
            if(remote.exists&&remoteFp!==meta.fingerprint){
                setStatus('offline','存在同步冲突');
                lastSyncTime.textContent='编辑已登录 · 本地和云端均有修改';
                if(showResult)showToast('编辑登录成功，但本地与云端均有修改，请点击“同步”处理','error');
            }else{
                setStatus('offline','有未同步修改');
                lastSyncTime.textContent='编辑已登录 · 正在恢复未同步修改';
                scheduleSync();
                if(showResult)showToast('编辑登录成功，已恢复本地未同步修改','success');
            }
        }else{
            entries=remote.entries;
            setUnlocked(true);
            render();
            record(entries,remote.sha);
            setStatus('online','编辑已登录');
            if(!remote.exists)lastSyncTime.textContent='编辑已登录 · 数据文件尚未创建';
            if(showResult)showToast('Token 验证成功，已启用编辑','success');
        }
        await restoreEntryDraftIfAny();
        return true;
    }catch(error){
        console.error(error);
        setUnlocked(false);
        if(publicLoaded||entries.length)render();
        setStatus(publicLoaded?'online':'offline',publicLoaded?'公开浏览':'公开数据不可用');
        lastSyncTime.textContent=publicLoaded?'公开浏览 · Token 验证失败':'公开数据未加载 · Token 验证失败';
        if(showResult)showToast(`编辑登录失败：${fmt(error)}`,'error');
        return false;
    }finally{syncBtn.disabled=!unlocked;}
}
async function sync(showResult=true,interactive=showResult){
    if(!unlocked||!validConfig()){showToast('请先使用 Token 登录','error');return false;}
    if(isSyncing)return false;
    clearTimeout(autoTimer);autoTimer=null;isSyncing=true;syncBtn.disabled=true;setStatus('syncing','同步中…');
    try{
        const local=sortEntries(normList(entries)),lf=fingerprint(local),baseline=meta.target===target()?meta.fingerprint:null;
        const remote=await readRemote();

        if(!remote.exists){
            if(baseline!==null&&interactive){
                if(!confirm('云端 Blog 数据文件已不存在。\n\n确定：用当前 Blog 数据重新创建云端文件。\n取消：停止同步。')){
                    setStatus('offline','同步已取消');return false;
                }
            }else if(baseline!==null&&!interactive){
                setStatus('offline','云端文件已删除');
                showToast('云端文件已删除，请点击“同步”决定是否重新创建','error');
                return false;
            }
            const sha=await writeRemote(local,null);record(local,sha);setStatus('online','编辑已登录');
            if(showResult)showToast('同步完成','success');return true;
        }

        const rf=fingerprint(remote.entries);
        if(lf===rf){record(local,remote.sha);setStatus('online','编辑已登录');if(showResult)showToast('本地与云端已一致','success');return true;}

        const lc=baseline===null||lf!==baseline,rc=baseline===null||rf!==baseline;
        if(baseline!==null&&lc&&!rc){
            const sha=await writeRemote(local,remote.sha);record(local,sha);setStatus('online','编辑已登录');
            if(showResult)showToast('同步完成','success');return true;
        }
        if(baseline!==null&&!lc&&rc){
            entries=remote.entries;
            await persistWorkingCopyNow(entries);
            render();record(entries,remote.sha);setStatus('online','编辑已登录');
            if(showResult)showToast('已采用云端最新数据','success');return true;
        }
        if(!interactive){
            setStatus('offline','存在同步冲突');
            showToast('本地和云端都发生了修改，请点击“同步”选择版本','error');
            return false;
        }

        if(confirm('检测到本地和云端数据不同。\n\n确定：用当前网页数据覆盖云端。\n取消：继续选择是否采用云端数据。')){
            const sha=await writeRemote(local,remote.sha);record(local,sha);setStatus('online','编辑已登录');
            showToast('已用当前网页数据覆盖云端','success');return true;
        }
        if(confirm('是否采用云端数据覆盖当前网页？\n\n确定：采用云端最新数据。\n取消：暂不处理。')){
            entries=remote.entries;
            await persistWorkingCopyNow(entries);
            render();record(entries,remote.sha);setStatus('online','编辑已登录');
            showToast('已采用云端数据','success');return true;
        }
        setStatus('offline','同步已取消');showToast('未覆盖本地或云端数据','info');return false;
    }catch(error){
        console.error(error);setStatus('offline','同步失败');showToast(`同步失败：${fmt(error)}`,'error');return false;
    }finally{isSyncing=false;syncBtn.disabled=!unlocked;}
}
function scheduleSync(){
    saveWorkingCache();
    if(!unlocked)return;
    clearTimeout(autoTimer);
    autoTimer=setTimeout(()=>{autoTimer=null;sync(false,false);},AUTO_DELAY);
}
function markChange(){
    render();
    setStatus('offline','待同步');
    lastSyncTime.textContent='有未同步修改';
    scheduleSync();
}

// ---------- Blog 编辑 ----------
function openEntry(i=null){
    if(!unlocked)return;
    previousFocus=document.activeElement;editingId=i;
    if(i){
        const x=entries.find(e=>e.id===i);if(!x)return;
        entryModalTitle.textContent='编辑博客';
        titleInput.value=x.title;dateInput.value=x.date;bodyEditor.innerHTML=cleanForStorage(x.body);
        entryDeleteBtn.classList.remove('hidden');
    }else{
        entryModalTitle.textContent='添加博客';
        titleInput.value='';dateInput.value=today();bodyEditor.innerHTML='';
        entryDeleteBtn.classList.add('hidden');
    }
    entryModal.classList.remove('hidden');
    entryInitialState=entryStateSnapshot();
    entryDraftLastSnapshot='';
    startEntryDraftAutosave();
    setTimeout(()=>titleInput.focus(),50);
}
function closeEntry(clearDraft=true){
    stopEntryDraftAutosave();
    if(clearDraft)clearEntryDraft();
    entryModal.classList.add('hidden');editingId=null;entryInitialState='';
    if(previousFocus instanceof HTMLElement)previousFocus.focus();
    previousFocus=null;
}
async function saveEntry(){
    if(!unlocked||entrySaveBtn.disabled)return;
    const title=titleInput.value.trim(),date=dateInput.value.trim(),body=autoIndentBeforeFirstDivider(bodyEditor.innerHTML);
    if(!title){showToast('请输入标题','error');titleInput.focus();return;}
    if(!date){showToast('请输入日期','error');dateInput.focus();return;}
    if(!textOf(body)){showToast('请输入正文','error');bodyEditor.focus();return;}

    const next=sortEntries(normList(entries));
    const now=Date.now();
    if(editingId){
        const x=next.find(e=>e.id===editingId);if(!x)return;
        x.title=title;x.date=date;x.body=body;x.updatedAt=now;
    }else next.push({id:id(),title,date,body,createdAt:now,updatedAt:now});
    sortEntries(next);

    entrySaveBtn.disabled=true;stopEntryDraftAutosave();
    try{
        const persisted=await persistWorkingCopyNow(next);
        entries=persisted;
        await clearEntryDraft();
        closeEntry(false);
        markChange();
        showToast('已保存','success');
    }catch(error){
        console.error(error);
        if(!entryModal.classList.contains('hidden'))startEntryDraftAutosave();
        showToast(`保存失败：${fmt(error)}`,'error');
    }finally{entrySaveBtn.disabled=false;}
}
async function delEntry(i){
    if(!unlocked)return false;
    const x=entries.find(e=>e.id===i);
    if(!x||!confirm(`确定删除“${x.title}”吗？`))return false;
    const next=entries.filter(e=>e.id!==i);
    try{
        entries=await persistWorkingCopyNow(next);
        await clearEntryDraft();
        markChange();
        showToast('已删除','success');
        return true;
    }catch(error){
        console.error(error);showToast(`删除失败：${fmt(error)}`,'error');return false;
    }
}

// ---------- 编辑器原有行为 ----------
function isExplicitNoIndent(value){return /^0(?:px|em|rem|%)?$/i.test(String(value||'').trim())}
function isDefaultIndentBlock(block){
    if(!(block instanceof Element)||!bodyEditor.contains(block))return false;
    const firstHr=bodyEditor.querySelector('hr');
    if(!firstHr)return true;
    if(block.contains(firstHr))return false;
    return!!(block.compareDocumentPosition(firstHr)&Node.DOCUMENT_POSITION_FOLLOWING);
}
function selectedEditorBlocks(){
    const sel=getSelection();if(!sel||!sel.rangeCount)return[];
    const range=sel.getRangeAt(0),tags=new Set(['P','DIV','BLOCKQUOTE','LI']);
    const blocks=[...bodyEditor.querySelectorAll('p,div,blockquote,li')].filter(el=>{
        if([...el.children].some(c=>tags.has(c.tagName)))return false;
        try{return range.intersectsNode(el)}catch(error){return false;}
    });
    if(blocks.length)return blocks;
    let n=sel.anchorNode;if(n?.nodeType===Node.TEXT_NODE)n=n.parentElement;
    const b=n instanceof Element?n.closest('p,div,blockquote,li'):null;
    return b&&bodyEditor.contains(b)?[b]:[];
}
function command(c){
    bodyEditor.focus();
    const keepNoIndent=c==='removeFormat'?selectedEditorBlocks().filter(b=>isExplicitNoIndent(b.style.textIndent)):[];
    document.execCommand(c,false,null);
    keepNoIndent.forEach(b=>{if(bodyEditor.contains(b))b.style.textIndent='0';});
    bodyEditor.dispatchEvent(new Event('input',{bubbles:true}));
}
function insertMathTemplate(display=false){
    bodyEditor.focus();
    const sel=getSelection(),selected=sel&&sel.rangeCount>0&&bodyEditor.contains(sel.anchorNode)?sel.toString():'';
    const body=selected||'x',text=display?`$$${body}$$`:`$${body}$`;
    document.execCommand('insertText',false,text);
    bodyEditor.dispatchEvent(new Event('input',{bubbles:true}));
}
function indent(){
    bodyEditor.focus();
    const s=getSelection();if(!s||!s.rangeCount)return;
    let n=s.anchorNode;if(n?.nodeType===Node.TEXT_NODE)n=n.parentElement;
    let b=n instanceof Element?n.closest('p,div,blockquote,li'):null;
    if(!b||!bodyEditor.contains(b)){
        document.execCommand('formatBlock',false,'p');
        let q=getSelection()?.anchorNode;if(q?.nodeType===Node.TEXT_NODE)q=q.parentElement;
        b=q instanceof Element?q.closest('p,div,blockquote,li'):null;
    }
    if(!b||!bodyEditor.contains(b))return;
    const inline=String(b.style.textIndent||'').trim();
    const effectivelyIndented=inline==='2em'||(!inline&&isDefaultIndentBlock(b));
    b.style.textIndent=effectivelyIndented?'0':'2em';
    bodyEditor.dispatchEvent(new Event('input',{bubbles:true}));
}
function pasteBody(e){
    const plain=e.clipboardData?.getData('text/plain')||'',html=e.clipboardData?.getData('text/html')||'';
    if(looksLikeLatexPlainText(plain)){
        e.preventDefault();bodyEditor.focus();document.execCommand('insertText',false,clipboardTextForEditor(plain,html));return;
    }
    const md=/\[[^\]\r\n]+\]\(https?:\/\/[^\s<>()]+\)/i;
    if(md.test(plain)){e.preventDefault();bodyEditor.focus();document.execCommand('insertText',false,plain);return;}
    if(html&&/<a\b/i.test(html)){
        const converted=linksToMarkdown(html);
        if(converted!==html){e.preventDefault();bodyEditor.focus();document.execCommand('insertHTML',false,cleanForStorage(converted));}
    }
}

// ---------- 配置 ----------
function openConfig(){
    previousFocus=document.activeElement;
    cfgToken.value=config.token||'';
    cfgOwner.value=config.owner||'';
    cfgRepo.value=config.repo||'';
    cfgFile.value=config.file||'blog_data.json';
    rememberToken.checked=Boolean(appGet(TOKEN_KEY));
    configModal.classList.remove('hidden');
    setTimeout(()=>cfgToken.focus(),50);
}
function closeConfig(){
    configModal.classList.add('hidden');
    if(previousFocus instanceof HTMLElement)previousFocus.focus();
    previousFocus=null;
}
async function submitConfig(e){
    e.preventDefault();
    if(configSaveBtn.disabled)return;
    const token=cfgToken.value.trim(),owner=cfgOwner.value.trim(),repo=cfgRepo.value.trim(),file=cfgFile.value.trim()||'blog_data.json';
    if(!token){showToast('请输入 GitHub Token','error');cfgToken.focus();return;}
    if(!owner){showToast('请输入仓库所有者','error');cfgOwner.focus();return;}
    if(!repo){showToast('请输入仓库名称','error');cfgRepo.focus();return;}
    if(!file||file.endsWith('/')){showToast('请输入有效的数据文件名','error');cfgFile.focus();return;}

    const old=target(),oldConfig={...config};
    config={owner,repo,file,token};
    configSaveBtn.disabled=true;
    try{
        await persistConfig();

        if(rememberToken.checked && appGet(TOKEN_KEY)!==config.token){
            throw new Error('Token 本地保存失败');
        }

        if(old&&old!==target()){
            meta={target:'',fingerprint:null,sha:null,lastSyncAt:null};
            await saveMeta();
        }
        closeConfig();
        await login(true);
    }catch(error){
        console.error(error);config=oldConfig;showToast(`配置保存失败：${fmt(error)}`,'error');
    }finally{configSaveBtn.disabled=false;}
}

    e.preventDefault();e.stopPropagation();
    const targetEl=document.getElementById(`entry-${a.dataset.id}`);
    if(targetEl)targetEl.scrollIntoView({behavior:'smooth',block:'start'});
    tocControl.classList.remove('open');tocButton.setAttribute('aria-expanded','false');hideTocHandle();
});
tocPanel.addEventListener('click',e=>e.stopPropagation());
document.addEventListener('click',e=>{
    if(!tocControl.contains(e.target)&&e.target!==tocEdgeSensor){
        tocControl.classList.remove('open');tocButton.setAttribute('aria-expanded','false');hideTocHandle();
    }
});
function fastScrollToTop(){
    const startY=window.scrollY;if(startY<=0)return;
    const root=document.documentElement,previousBehavior=root.style.scrollBehavior;
    root.style.scrollBehavior='auto';
    const duration=10,startTime=performance.now();
    function step(now){
        const progress=Math.min((now-startTime)/duration,1),eased=1-Math.pow(1-progress,3);
        window.scrollTo(0,Math.round(startY*(1-eased)));
        if(progress<1)requestAnimationFrame(step);
        else root.style.scrollBehavior=previousBehavior;
    }
    requestAnimationFrame(step);
}
backToTopBtn.addEventListener('click',fastScrollToTop);
function topBtn(){backToTopBtn.classList.toggle('visible',scrollY>260)}
addEventListener('scroll',topBtn,{passive:true});
addEventListener('resize',alignTocToFirstEntry,{passive:true});
topBtn();

})();
})();
