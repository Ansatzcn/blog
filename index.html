<body>
<main class="container">
<header class="page-header">
<div><h1>Blog</h1><div class="cloud-status"><span class="dot" id="statusDot"></span><span id="statusText">未配置</span></div></div>
<nav class="header-actions"><button class="header-link" id="addLink" type="button">添加</button><button class="header-link" id="syncBtn" type="button">同步</button><button class="header-link" id="configBtn" type="button">配置</button></nav>
</header>
<div class="sync-meta" id="lastSyncTime">未同步</div>
<section class="entry-list" id="entryList" aria-live="polite"></section>
</main>

<aside class="toc-control" id="tocControl" aria-label="文章目录">
<button type="button" class="toc-button" id="tocButton" aria-expanded="false" aria-controls="tocPanel">目录</button>
<nav class="toc-panel" id="tocPanel" aria-label="文章目录列表">
<div class="toc-head"><span>目录</span></div>
<ul class="toc-list" id="tocList"></ul>
</nav>
</aside>
<button class="back-to-top" id="backToTopBtn" type="button">↑ 回到顶部</button>

<div class="modal-overlay hidden" id="entryModal" role="dialog" aria-modal="true" aria-labelledby="entryModalTitle">
<div class="modal-box">
<div class="modal-scroll">
<h2 class="modal-title" id="entryModalTitle">添加博客</h2>
<div class="form-group"><label for="titleInput">标题</label><input id="titleInput" type="text" maxlength="200" autocomplete="off"></div>
<div class="form-group"><label for="dateInput">日期</label><input id="dateInput" type="date"></div>
<div class="form-group"><label for="bodyEditor">正文</label><div class="editor-shell"><div class="editor-toolbar" role="toolbar" aria-label="正文格式工具">
<button class="editor-tool bold" data-command="bold" type="button">B</button><button class="editor-tool italic" data-command="italic" type="button">I</button><button class="editor-tool underline" data-command="underline" type="button">U</button><button class="editor-tool" data-command="justifyLeft" type="button">左</button><button class="editor-tool" data-command="justifyCenter" type="button">中</button><button class="editor-tool" data-command="justifyRight" type="button">右</button><button class="editor-tool" id="indentBtn" type="button">首行缩进</button><button class="editor-tool" data-command="insertUnorderedList" type="button">• 列表</button><button class="editor-tool" data-command="insertHorizontalRule" type="button" title="插入分隔横线">横线</button><button class="editor-tool" data-command="removeFormat" type="button">清除格式</button>
</div><div class="editor" id="bodyEditor" contenteditable="true" role="textbox" aria-multiline="true" spellcheck="true"></div></div></div>
</div><div class="modal-actions"><button class="modal-btn secondary" id="entryCancelBtn" type="button">取消</button><button class="modal-btn primary" id="entrySaveBtn" type="button">保存</button></div>
</div></div>

<div class="modal-overlay hidden" id="configModal" role="dialog" aria-modal="true" aria-labelledby="configModalTitle">
<form class="config-box" id="configForm" autocomplete="on"><div class="config-scroll" tabindex="0">
<h2 class="modal-title" id="configModalTitle">GitHub 云端配置</h2><div class="config-desc">配置后博客条目会与指定 GitHub 仓库中的 JSON 文件同步。Token 会保存在当前浏览器中。</div>
<div class="form-group"><label for="cfgSavedToken">已保存 Token</label><div class="token-row"><select id="cfgSavedToken"><option value="">新增 Token</option></select><button class="token-btn" id="cfgNewTokenBtn" type="button">新增</button><button class="token-btn danger" id="cfgDeleteTokenBtn" type="button" disabled>删除</button></div><div class="hint">可在当前浏览器保存多个 Token；选择后会自动填充对应仓库配置。</div></div>
<div class="form-group"><label for="cfgTokenName">Token 名称</label><input id="cfgTokenName" type="text" autocomplete="off" placeholder="例如：个人博客"></div>
<div class="form-group"><label for="cfgToken">GitHub Personal Access Token *</label><input id="cfgToken" name="github-token-new" type="password" autocomplete="new-password" spellcheck="false" placeholder="github_pat_... 或 ghp_..."><div class="token-note">在本设备保存Token。若浏览器出现“保存密码”提示，请选择保存；开启浏览器密码同步后，其他设备可自动填充。</div><div class="hint"><a href="https://github.com/settings/personal-access-tokens" target="_blank" rel="noopener noreferrer">创建细粒度 Token</a>（仅授权目标仓库，并授予 <strong>Contents: Read and write</strong>）</div></div>
<div class="form-group"><label for="cfgOwner">仓库所有者 *</label><input id="cfgOwner" name="github-owner" type="text" autocomplete="username"></div>
<div class="form-group"><label for="cfgRepo">仓库名称 *</label><input id="cfgRepo" type="text" placeholder="blog"></div>
<div class="form-group"><label for="cfgFile">数据文件名</label><input id="cfgFile" type="text" value="blog_data.json"></div>
</div><div class="config-actions"><button class="btn-config secondary" id="configCancelBtn" type="button">取消</button><button class="btn-config primary" id="configSaveBtn" type="submit">保存并连接</button></div></form>
</div>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
